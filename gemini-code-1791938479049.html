<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한영외고 급식 식단 조회</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { color: #1a365d; text-align: center; margin-bottom: 25px; }
    .search-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
    input[type="date"] { padding: 10px 15px; font-size: 16px; border: 1px solid #cbd5e0; border-radius: 6px; }
    button { padding: 10px 20px; font-size: 16px; background-color: #3182ce; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #2b6cb0; }
    .meal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .meal-card { background: #edf2f7; border-radius: 8px; padding: 20px; border-left: 5px solid #3182ce; }
    .meal-card h2 { margin-top: 0; color: #2d3748; border-bottom: 2px solid #cbd5e0; padding-bottom: 8px; }
    .menu-list { line-height: 1.8; color: #4a5568; }
    .info { margin-top: 15px; font-size: 0.9em; color: #718096; background: #fff; padding: 10px; border-radius: 4px; }
    .empty { text-align: center; color: #a0aec0; padding: 40px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🏫 한영외국어고등학교 급식 정보</h1>
  
  <div class="search-box">
    <input type="date" id="mealDate">
    <button onclick="fetchMealInfo()">식단 조회</button>
  </div>

  <div id="mealResult" class="meal-grid">
    <div class="empty">날짜를 선택하고 [식단 조회] 버튼을 눌러주세요.</div>
  </div>
</div>

<script>
  // 오늘 날짜 기본 세팅
  document.getElementById('mealDate').value = new Date().toISOString().substring(0, 10);

  async function fetchMealInfo() {
    const rawDate = document.getElementById('mealDate').value;
    if(!rawDate) {
      alert("날짜를 선택해주세요.");
      return;
    }

    const ymd = rawDate.replace(/-/g, '');
    const apiKey = '95337edfb2b2456e9866ae124aeafe23';
    const eduCode = 'B10'; // 서울특별시교육청
    const schoolCode = '7010259'; // 한영외국어고등학교
    
    const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${apiKey}&Type=json&pIndex=1&pSize=100&ATPT_OFCDC_SC_CODE=${eduCode}&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${ymd}`;

    const resultDiv = document.getElementById('mealResult');
    resultDiv.innerHTML = '<div class="empty">급식 정보를 불러오는 중입니다...</div>';

    try {
      const response = await fetch(url);
      const data = await response.json();

      if (data.mealServiceDietInfo) {
        const rows = data.mealServiceDietInfo[1].row;
        resultDiv.innerHTML = '';

        rows.forEach(item => {
          // 메뉴 줄바꿈 및 깔끔하게 정리
          const menuClean = item.DDISH_NM.split('<br/>').join('<br/>• ');
          
          const cardHtml = `
            <div class="meal-card">
              <h2>${item.MMEAL_SC_NM} (${item.CAL_INFO})</h2>
              <div class="menu-list">• ${menuClean}</div>
              <div class="info">
                <strong>급식인원:</strong> ${item.MLSV_FGR}명<br/>
                <strong>영양 정보:</strong><br/> ${item.NTR_INFO.split('<br/>').join(', ')}
              </div>
            </div>
          `;
          resultDiv.innerHTML += cardHtml;
        });
      } else {
        resultDiv.innerHTML = '<div class="empty">해당 날짜에는 등록된 급식 정보가 없습니다.</div>';
      }
    } catch (error) {
      console.error(error);
      resultDiv.innerHTML = '<div class="empty">데이터를 불러오는 중 오류가 발생했습니다. (CORS 문제 시 로컬 서버 환경 필요)</div>';
    }
  }
</script>

</body>
</html>
